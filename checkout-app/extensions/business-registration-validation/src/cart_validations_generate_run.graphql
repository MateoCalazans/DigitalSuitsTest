query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  cart {
    registrationNumber: metafield(
      namespace: "$app:business"
      key: "registration_number"
    ) {
      value
    }
    deliveryGroups {
      deliveryAddress {
        company
      }
    }
    billingAddress {
      company
    }
  }
}
